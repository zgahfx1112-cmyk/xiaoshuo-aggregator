# Render Blueprint for Xiaoshuo Aggregator (No Database)
# Pure source-based architecture - no PostgreSQL or Redis required

services:
  - type: web
    name: xiaoshuo-aggregator
    env: node
    region: oregon # or singapore for Asia
    plan: free # Starter plan (free tier)
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_APP_NAME
        value: "小说聚合平台"

# No database required - all data stored in localStorage on client
# No Redis required - rate limiting uses in-memory storage