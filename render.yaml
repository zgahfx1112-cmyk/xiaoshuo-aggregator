# Render Blueprint for Xiaoshuo Aggregator
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: xiaoshuo-aggregator
    env: node
    region: oregon # or singapore for Asia
    plan: free # Starter plan (free tier)
    buildCommand: npm install && npm run db:generate && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: xiaoshuo-db
          property: connectionString
      - key: REDIS_URL
        sync: false # Manual setup required (Upstash)
      - key: REDIS_TOKEN
        sync: false # Manual setup required (Upstash)
      - key: CRON_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_APP_NAME
        value: "小说聚合平台"
      - key: YCKCEO_SOURCE_URL
        value: "https://www.yckceo.com/yuedu/shuyuan"

databases:
  - name: xiaoshuo-db
    databaseName: xiaoshuo
    user: xiaoshuo_user
    plan: free # PostgreSQL Free: 1GB storage, 97 connections
    region: oregon # Same region as web service

# Note: Redis is not included in Render's free tier.
# Recommended: Use Upstash Redis (https://upstash.com)
# - Free tier: 10,000 requests/day, 256MB storage
# - Create at https://console.upstash.io
# - Add REDIS_URL and REDIS_TOKEN manually in Render dashboard

# Cron Job Setup (for periodic tasks):
# Use UptimeRobot or cron-job.org to ping the cron endpoint
# Endpoint: GET /api/cron/update-sources?secret=<CRON_SECRET>
# Schedule: Every 6 hours recommended